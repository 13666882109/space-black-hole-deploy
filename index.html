  <!-- 顶部标识栏 -->
  <div class="hud-header hud-panel hud-transition">
    <div class="eyebrow">Relativistic General Relativity Raytracer</div>
    <h1 data-i18n="headerTitle">Gargantua // 卡冈都亚</h1>
  </div>

  <!-- 遥测：宽屏面板 + 窄屏极简帧率 -->
  <div class="telemetry hud-panel hud-transition">
    <div class="perf-row">
      <span class="label" data-i18n="telFps">实时帧率</span>
      <span class="fps-badge" id="tel-fps">60 FPS (2.1 ms)</span>
    </div>
    <div class="row"><span class="label" data-i18n="telRes">渲染缓冲</span><span class="val" id="tel-res">1920×1080 (1.20x)</span></div>

    <div class="row"><span class="label" data-i18n="telInc">轨道姿态</span><span class="val" id="tel-inc">+8.1° / 24°</span></div>
    <div class="row"><span class="label" data-i18n="telSeed">星域序列</span><span class="val" id="tel-seed">#A7F2</span></div>
  </div>

  <div class="fps-mini hud-panel hud-transition" id="fps-mini">60</div>

    <div class="preset-row">
      <button class="preset-btn active" data-pitch="0.142" data-scale="1.00" data-roll="-10" data-i18n="preset1">经典卡冈都亚</button>
      <button class="preset-btn" data-pitch="0.038" data-scale="1.15" data-roll="-4" data-i18n="preset2">掠射赤道 88°</button>
      <button class="preset-btn" data-pitch="1.5708" data-scale="0.85" data-roll="0" data-i18n="preset3">极轴俯瞰 90°</button>
    </div>

    <div class="control-group">
      <div class="control-label">
        <span data-i18n="lblZoom">视界尺度</span>
        <span id="val-zoom">1.00x</span>
      </div>
      <input type="range" id="slider-zoom" min="0.10" max="2.50" step="0.01" value="1.00" />
    </div>

    <div class="control-group">
      <div class="control-label">
        <span data-i18n="lblGlow">吸积盘光度</span>
        <span id="val-glow">1.22</span>
      </div>
      <input type="range" id="slider-glow" min="0.40" max="2.40" step="0.05" value="1.22" />
    </div>

    <div class="control-group">
      <div class="control-label">
        <span data-i18n="lblDoppler">多普勒集束</span>
        <span id="val-doppler">1.00</span>
      </div>
      <input type="range" id="slider-doppler" min="0.00" max="1.60" step="0.05" value="1.00" />
    </div>

    <div class="control-group">
      <div class="control-label">
        <span data-i18n="lblTemp">黑体色温</span>
        <span id="val-temp">1.00</span>
      </div>
      <input type="range" id="slider-temp" min="0.60" max="1.60" step="0.05" value="1.00" />
    </div>

    <div class="control-group">
      <div class="control-label">
        <span data-i18n="lblCosmos">星尘丰度</span>
        <span id="val-cosmos">1.00</span>
      </div>
      <input type="range" id="slider-cosmos" min="0.00" max="2.00" step="0.05" value="1.00" />
    </div>

    <div class="control-group">
      <div class="control-label">
        <span data-i18n="lblTwinkle">星光闪烁</span>
        <span id="val-twinkle">1.00</span>
      </div>
      <input type="range" id="slider-twinkle" min="0.00" max="3.00" step="0.05" value="1.00" />
    </div>

    <div class="control-group">
      <div class="control-label">
        <span data-i18n="lblBloom">镜头眩光</span>
        <span id="val-bloom">0.80</span>
      </div>
      <input type="range" id="slider-bloom" min="0.00" max="2.00" step="0.05" value="0.80" />
    </div>

    <div class="control-group">
      <div class="control-label">
        <span data-i18n="lblScreenBloom">泛光</span>
        <span id="val-screenbloom">0.70</span>
      </div>
      <input type="range" id="slider-screenbloom" min="0.00" max="2.00" step="0.05" value="0.70" />
    </div>

    <div class="control-group">
      <div class="control-label">
        <span data-i18n="lblSpeed">轨道角速</span>
        <span id="val-speed">1.00</span>
      </div>
      <input type="range" id="slider-speed" min="0.00" max="2.20" step="0.05" value="1.00" />
    </div>

    <div class="control-group">
      <div class="control-label">
        <span data-i18n="lblRoll">镜头倾角</span>
        <span id="val-roll">-10°</span>
      </div>
      <input type="range" id="slider-roll" min="-180" max="180" step="1" value="-10" />
    </div>

    <div class="control-group">
      <div class="control-label">
        <span data-i18n="lblScale">超采样率</span>
        <span id="val-scale">1.20x</span>
      </div>
      <input type="range" id="slider-scale" min="0.50" max="1.80" step="0.05" value="1.20" />
    </div>

    <div class="btn-row">
      <button id="btn-drs" class="action-btn active" title="自动保持满帧运行，最高超采样至 1.30x">自适应满帧: 开</button>
      <button id="btn-autorotate" class="action-btn active">轨道巡航: 开</button>
    </div>
    <div class="btn-row">
      <button id="btn-photonring-toggle" class="action-btn" data-i18n="photonRing">光子环</button>
      <button id="btn-legacy-shadow" class="action-btn" data-i18n="legacyShadow">旧版黑洞</button>
      <button id="btn-random-cosmos" class="action-btn" data-i18n="randomCosmos">随机星域</button>
      <button id="btn-reset" class="action-btn" data-i18n="resetAll">全部重置</button>
    </div>
  </div>

  <!-- 底部操作栏 -->
  <div class="hud-bottom-bar">
    <button class="hud-toggle-btn hud-landscape-btn" id="btn-landscape" title="切换横屏 / 竖屏">横屏</button>
    <button class="hud-toggle-btn" id="btn-toggle-hud" title="快捷键: H"><span class="hud-text-full">隐藏界面 (H)</span><span class="hud-text-short">隐藏</span></button>
  </div>

  <!-- 渲染画布与入口模块 -->
  <canvas id="glcanvas"></canvas>

</body>
</html>
