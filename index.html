      // [TOL][COUPLED ↔ bShadow] 捕获遮罩：bCrit²=6.75 放宽约 1.5%，把绕光子球多圈、积分出噪点的
      // 近临界射线收进阴影；旧版 isCapturedOrbit（第 1/2 节）与新版捕获带据它判吞没。禁改回 6.75
      const float captureB2 = 6.85;
      const float bShadow = sqrt(captureB2);  // 环辉临界带外边界，派生自 captureB2

#ifdef DISK_NEW
      // =====================================================================
      // 新版吸积盘：有限厚度盘板（半厚 DISK_H）+ 体积辉光。常量移植自实验页
      // （index (2).html，提交 cf730b5）；[COUPLED] 与 disk-bake.frag.glsl /
      // disk-glow-noise-bake.frag.glsl / pipeline.js / main.js 互引
      // =====================================================================
      const float DISK_H = 0.060;   // [ART] 盘半厚
      const float DISK_F_MAX = 7.0; // [ART] 盘板柱因子上限（法向 F=1 即面密度）

      /* 烘焙纹理径向范围：v∈[0,1] ↔ r∈[2.12, 10.20]（边缘），1024 行纹素中心落在
         r∈[2.1239, 10.1961]（v=(i+0.5)/1024）。
         约束链：DISK_R_OUT 不得超过 DISK_TEX_R0+DISK_TEX_DR，否则 vT>1 被 CLAMP_TO_EDGE
         吃掉、.g/.b 采样值冻结在末行纹素（r=10.1961）而真值随 DISK_R_OUT 继续下降。
         改 DISK_R_OUT 须同步本组 */
      const float DISK_TEX_R0 = 2.12, DISK_TEX_DR = 8.08;  // [COUPLED ↔ disk-bake.frag.glsl 同名常量]
      const float DISK_TEX_H = 1024.0;  // [COUPLED ↔ pipeline.js texStorage2D 2048×1024] 径向纹元数

      /* 辉光噪声：R8 预扭曲栅格纹理（disk-glow-noise-bake 烘焙，栅格 N_CELLS 单元平铺）。
         世界 → 栅格频率 NOISE_FREQ 不变，纹理按 1/M_TEX 单元间隔预置 smoothstep 权，
         硬件双线性在采样端复现 smoothstep 加权的值噪声；图案随时间漂移，
         周期 = N_CELLS/GLOW_DRIFT = 1066.7s */
      const float NOISE_INV = 1.0/64.0;  // [COUPLED ↔ disk-glow-noise-bake.frag.glsl N_CELLS] 采样坐标 = 栅格坐标×NOISE_INV
      const float NOISE_FREQ = 0.55;     // 世界 → 栅格频率（栅格单位/世界单位）
      const float GLOW_DRIFT = 0.06;     // [COUPLED ↔ main.js DISK_TIME_WRAP] 时间漂移速度（栅格单位/秒）

      /* 盘面湍流相位周期（秒）。[COUPLED ↔ main.js DISK_TIME_WRAP] 回卷周期须为它的倍数 */
      const float TW_PERIOD = 13.0;

      /* 辉光密度调制：gd = env × GLOW_GAIN × (GLOW_BASE + GLOW_MOD × n)，
         n 为辉光噪声纹理采样值（见 NOISE_*）。GLOW_BASE 与 NOISE_FREQ 同为 0.55 但含义无关 */
      const float GLOW_GAIN = 0.028;  // [ART] 辉光密度总增益
      const float GLOW_BASE = 0.55;   // [ART] 辉光密度基线（噪声为零时的系数）
      const float GLOW_MOD  = 0.9;    // [ART] 辉光噪声调制幅度

      const float SIG_LO = 0.71,  SIG_RNG = 0.700;  // [COUPLED ↔ disk-bake.frag.glsl 同名常量]
      const float AR_LO  = 0.385, AR_RNG = 0.665;  // [COUPLED ↔ disk-bake.frag.glsl 同名常量]
      const int   MAXS  = 300;    // 测地线积分步数上限

      const float RC_DT1  = (DISK_R_OUT + 1.6)*(DISK_R_OUT + 1.6);
      const float RC_DT2  = (DISK_R_OUT + 0.6)*(DISK_R_OUT + 0.6);
      const float RC_GMAX = (DISK_R_OUT*0.99)*(DISK_R_OUT*0.99);

         辉光带 FINE_Y_OUT..2.2 只有低频辉光积分，放宽到 DT_GLOW */
      const float FINE_Y_IN  = 0.12;  // [ART] 细化权窗内缘：以内全细化
      const float FINE_Y_OUT = 0.55;  // [COUPLED ↔ 步长亚层门 ayv<FINE_Y_OUT] 权窗外缘=亚层外缘
      const float DT_NEAR = 0.32;     // [ART] 近盘亚层步长上限
      const float DT_GLOW = 0.70;     // [TOL] 辉光带步长上限（实测见实验页注释）

      /* [ART-几何] 着色体最大半径：盘 r ≤ 10.2；辉光 rc < 10.098 且 |y| < 2.49 ⇒ r < 10.41。
         r > 11.6 后无任何着色体（留 1.2 裕量） */
      const float R_SAFE2 = 11.6*11.6;

      /* [ART-几何] 撞击参数剔除：光子轨道转折点 h² = r³/(r−1)；h² > 137 ⇒ r_min > 11.17，

      const float H_CULL2 = 137.0;

         NEW_GLOW_GAIN：主仓默认 uGlow=1.22 → 实验页默认 1.55（1.22×1.27≈1.55）；

      const float NEW_GLOW_GAIN = 1.27;
      const float NEW_DOPPLER_GAIN = 0.8125;

      /* 黑体色：美术调校的普朗克轨迹，700K–12000K（高质量版） */
      vec3 blackbody(float T){
        float x = clamp(T, 700.0, 12000.0);
        vec3 c = vec3(1.00, 0.08, 0.00);
        c = mix(c, vec3(1.00, 0.34, 0.05), smoothstep( 700.0, 1900.0, x));
        c = mix(c, vec3(1.00, 0.56, 0.21), smoothstep(1900.0, 2900.0, x));
        c = mix(c, vec3(1.00, 0.74, 0.45), smoothstep(2900.0, 3900.0, x));
        c = mix(c, vec3(1.00, 0.87, 0.68), smoothstep(3900.0, 4900.0, x));
        c = mix(c, vec3(1.00, 0.95, 0.88), smoothstep(4900.0, 5900.0, x));
        c = mix(c, vec3(0.98, 0.98, 1.00), smoothstep(5900.0, 7000.0, x));
        c = mix(c, vec3(0.89, 0.93, 1.00), smoothstep(7000.0, 9000.0, x));
        c = mix(c, vec3(0.78, 0.86, 1.00), smoothstep(9000.0,12000.0, x));
        return c;
      }
      /* 廉价色阶：仅用于微弱辉光层（2200..5600K） */
      vec3 bbGlow(float T){
        float k = clamp((T - 2200.0)/3400.0, 0.0, 1.0);
        return vec3(1.0, 0.30 + 0.60*k, 0.06 + 0.78*k);
      }

      /* 盘板一步采样：累加柱因子 fAcc、光学厚度 tau、辐射 emit（不写 col/trans）。
         只累加不结算：柱因子、光学厚度、辐射分别累加，整段穿越结束后由
         diskSlabSettle 统一结算，使发射量正比于整段柱密度，不被盘板自身光学厚度压饱和。
         柱因子上限 DISK_F_MAX：整段等比缩放，掠射方向柱长再长也不超 DISK_F_MAX 倍面密度 */
      void diskSlabSample(vec3 p0, vec3 p1, vec3 dir, vec3 tw,
                          float dy, float invDy, float tEnter, float tExit,
                          inout float fAcc, inout float tau, inout vec3 emit){
        /* 代表点取赤道交点（夹到本步内）：掠射时步中点会落在错误半径 */
        float tSample = clamp(-p0.y*invDy, tEnter, tExit);
        vec3  pm = mix(p0, p1, tSample);
        float rc = length(pm.xz);
        if (rc < DISK_R_IN || rc > DISK_R_OUT) return;

        /* 径向包络：sigma 取自纹理 .g 通道，env 早退放在纹理采样之后 */
        float inner = smoothstep(DISK_R_IN, DISK_R_IN + 0.32, rc);
        float outer = 1.0 - smoothstep(DISK_R_OUT*0.42, DISK_R_OUT*0.985, rc);
        float base  = inner*outer;

        /* [EXACT] 抛物剖面 (1-u²) 的弦段均值 = (ua²+ua·ub+ub²)/3；
           按 (4/3)H 归一，使法向整板积分回到面密度 */
        float ua = clamp((p0.y + dy*tEnter)/DISK_H, -1.0, 1.0);
        float ub = clamp((p0.y + dy*tExit )/DISK_H, -1.0, 1.0);
        float vert = max(0.0, 1.0 - (ua*ua + ua*ub + ub*ub)*(1.0/3.0));

        float seg = (tExit - tEnter)*length(p1 - p0);
        float f   = vert * seg * (1.0/((4.0/3.0)*DISK_H));

        /* [COUPLED ↔ disk-bake.frag.glsl 输出 d/1.3 + .g sigma + .b pow(R_IN/r,0.62)]
           湍流纹理：两组相位交叉淡化；极坐标下相位旋转等价于方位角平移 */
        float om  = 2.4*inversesqrt(rc*rc*rc);  // r^-1.5：inversesqrt 单指令替代 pow
        float k   = om*0.15915494;              // 1/2π
        float azU = 0.5 + atan(pm.z, pm.x)*0.15915494;  // 极角→[0,1)，S 端 REPEAT 无缝回绕
        float vT  = (rc - DISK_TEX_R0)*(1.0/DISK_TEX_DR);   // 半径→[0,1)

        /* mip 判定：按单像素在盘面上的足迹等效边长。掠射时下限 0.28 防止 LOD 无限升高；
           pitch=0 时首步足迹为 0，max 下限防 log2(0) 未定义。
           .g/.b 跟随同一 lod，二者只沿径向变化，缓变幂律对升 lod 不敏感 */
        float pixLen = length(pm - uCamPos) * uInvMinDim * inversesqrt(max(abs(dir.y), 0.28));
        float lod = clamp(log2(max(pixLen*(DISK_TEX_H/DISK_TEX_DR), 1e-6)), 0.0, 6.0);
        vec4  tex1 = textureLod(uDiskTex, vec2(azU - k*tw.x, vT), lod);
        vec4  tex2 = textureLod(uDiskTex, vec2(azU - k*tw.y, vT), lod);
        float d     = mix(tex1.r, tex2.r, tw.z) * 1.3;
        float sigma = tex1.g*SIG_RNG + SIG_LO;   // 径向密度律 1.3*pow(rc/R_IN,-0.45)+0.06
        float aR    = tex1.b*AR_RNG + AR_LO;      // pow(R_IN/rc, 0.62)

        /* 边缘环带 env*2.8 低于阈值直接返回（命中范围极窄） */
        float env = base*sigma;
        if (env*2.8 < 2e-4) return;

        fAcc += f;

        float mass = env*f;
        mass *= d*d*2.1 + 0.035;
        if (mass < 2e-4) return;

        /* 相对论因子：轨道多普勒 + 引力红移。
           局部圆轨道速度 v = √(M/(r−rs))，ISCO 处恰为 0.5c */
        float v   = min(sqrt(0.5/max(rc - 1.0, 0.32)), 0.86);
        vec3  vd  = vec3(-pm.z, 0.0, pm.x)/rc;  // rc 即该向量长度，等价 normalize
        float gam = inversesqrt(1.0 - v*v);
        float dop = 1.0/(gam*(1.0 + v*dot(vd, dir)));  // dir 为光线传播方向
        float grv = sqrt(1.0 - 1.0/rc);
        float g   = dop * grv;
        float gi  = pow(g, 3.2*uDoppler*NEW_DOPPLER_GAIN);  // 相对论聚束 I ~ g³

        /* 薄盘温度 T ~ r^-0.75（美术压缩），多普勒改变颜色；uTemp 复用主仓色温滑杆 */
        float Tk = 8200.0 * aR * uTemp;                // aR = pow(R_IN/rc, 0.62)
        Tk *= pow(g, 0.9*uDoppler*NEW_DOPPLER_GAIN);

        float lum  = pow(Tk/8200.0, 1.9);
        tau  += mass;
        emit += blackbody(Tk) * (mass * lum * gi * 0.75 * uGlow * NEW_GLOW_GAIN);
      }

      /* 盘板整段结算：柱因子超上限时按 k = min(1, DISK_F_MAX/F) 等比缩放辐射与光学厚度 */
      void diskSlabSettle(float f, float tau, vec3 emit, float t0,
                          inout vec3 col, inout float trans){
        float k = f > DISK_F_MAX ? DISK_F_MAX/f : 1.0;
        col   += t0 * emit * k;
        trans *= exp(-tau * 0.85 * k);
      }

#else
      // =====================================================================
      // 旧版吸积盘：有限厚度平板 + 程序化细丝（canReachDiskSlab 与 main 共用）
      // =====================================================================
      const float DISK_H = 0.098;        // [ART] 盘半厚

      // 密度包络：细丝项经 clamp 后 ≤ DENS_FIL，日冕项在发射点（radialNorm>0）≤ CORONA_MAX，
      // 故密度系数恒 ≤ DENS_MAX，emitPossible 门限据此成立
      const float DENS_BASE = 0.16;       // [ART] 盘底发射分量
      const float DENS_FIL = 0.84;        // [ART] 细丝调制权重
      const float CORONA_MAX = 0.45;      // [ART] 日冕内缘幅值
      const float DENS_MAX = DENS_BASE + DENS_FIL + CORONA_MAX;  // 密度系数上界（勿单独改）

      // 精确可达性判定：直线射线能否触及盘板体（rIn ≤ r ≤ rOut 且 |y| ≤ diskH）。
      // y 区间与 r 不等式区间求交；转移只发生在直线真实相切处，该处盘缘发射已连续趋零
      bool canReachDiskSlab(vec3 pos, vec3 dir) {
        float tLo, tHi;
        if (abs(dir.y) < 1e-8) {
          if (abs(pos.y) > DISK_H) {
            return false;
          }
          tLo = 0.0;
          tHi = 1e30;
        } else {
          float tA = (-DISK_H - pos.y) / dir.y;
          float tB = ( DISK_H - pos.y) / dir.y;
          tLo = min(tA, tB);
          tHi = max(tA, tB);
          if (tHi < 0.0) {
            return false;
          }
          tLo = max(tLo, 0.0);
        }

        float pd = dot(pos, dir);
        float r2 = dot(pos, pos);
        float disc = pd * pd - (r2 - DISK_R_OUT2);
        if (disc < 0.0) {
          return false;
        }
        float sq = sqrt(disc);
        tLo = max(tLo, max(-pd - sq, 0.0));
        tHi = min(tHi, -pd + sq);
        if (tHi < tLo) {
          return false;
        }

        float discIn = pd * pd - (r2 - DISK_R_IN2);
        if (discIn < 0.0) {
          return true;
        }
        float sqIn = sqrt(discIn);
        return (tLo <= -pd - sqIn) || (tHi >= -pd + sqIn);
      }
#endif

      void main() {
        vec2 uv = (gl_FragCoord.xy - 0.5 * uResolution) * uInvMinDim;
        float invMinDim2 = uInvMinDim * uInvMinDim;

        vec3 pos = uCamPos;
        vec3 dir0 = normalize(uCamForward + uv.x * uCamRight + uv.y * uCamUp);
        vec3 dir = dir0;

        const float rs = 1.0;                   // normalized Schwarzschild radius

        float r0 = uCamR0;
        float rDotD0 = dot(pos, dir0);
        float cosRayAngle0 = rDotD0 / r0;
        vec3 pPerp0 = pos - rDotD0 * dir0;
        float impactParameterSquared = dot(pPerp0, pPerp0);
        float b = sqrt(impactParameterSquared);

        vec3 ePerp = b > 1e-5 ? (-pPerp0 / b) : vec3(0.0);
        float b2Safe = max(impactParameterSquared, 1e-4);
        // [EXACT] 一阶弱场偏折 δ₁(c) = (rs/2b)·(1-c)²(2+c) 闭式（自当前点积分到无穷远），baseWeakTerm
        //         即去常数后的 (1-c)²(2+c)/b²，两分支借 b²=r0²(1-c²) 代数等价；分母 1e-4 仅防 b→0 [TOL]
        float denom = (cosRayAngle0 >= 0.0)
          ? max(1e-4, r0 * r0 * (1.0 + cosRayAngle0))
          : (b2Safe / (1.0 - cosRayAngle0));
        float baseWeakTerm = (1.0 - cosRayAngle0) * (2.0 + cosRayAngle0) / denom;

        vec3 accumColor = vec3(0.0);
        float transmittance = 1.0;
        bool swallowed = true;

#ifdef DISK_NEW
        // =====================================================================
        // 2. 新版盘板：撞击参数解析剔除 + 捕获带 + 300 步速度 Verlet
        // =====================================================================
        if (impactParameterSquared > H_CULL2) {
          swallowed = false;
        } else {
          vec3 tw = vec3(mod(uDiskTime, TW_PERIOD),
                          mod(uDiskTime + 0.5*TW_PERIOD, TW_PERIOD),
                          abs(2.0*fract(uDiskTime*(1.0/TW_PERIOD)) - 1.0));
          float r2 = dot(pos, pos);
          float r  = sqrt(r2);
          float K  = -1.5*impactParameterSquared;  // [EXACT] 力常数，循环外预算
          float ER2   = uEscapeR*uEscapeR;
          float EXIT2 = min(R_SAFE2, ER2);  // 出射早停阈值上提为循环不变量
          bool  isCapturedNew = (impactParameterSquared < captureB2) && (rDotD0 < 0.0);
          // [COUPLED ↔ 旧版盘 useLegacy] 「旧版黑洞」开关：与旧版盘同一语义 —— 每步把光线方向
          // 归一化（|v| = 1 的牛顿口径）。新版盘默认保留伪牛顿形式（|v| = √(1+h²/r³)，见积分步），
          // 归一化会逐步削去角动量 h、误判掠射光线为捕获，故仅在该开关打开时启用
          bool  useLegacy = uLegacyShadow > 0.5;

          /* 盘板穿越状态：进入时记下透射率，穿越结束后一次性结算 */
          bool  inSlab   = false;
          float slabF    = 0.0;
          float slabTau  = 0.0;
          vec3  slabEmit = vec3(0.0);
          float slabT0   = 1.0;

          vec3 acc = pos * (K/(r2*r2*r));  // [EXACT] 标量先除后乘

          for (int i = 0; i < MAXS; i++){
            float pdIn = dot(pos, dir);
            /* 吞没：视界 1.02、光子陷阱 1.45（内向）；捕获带光线到盘内缘即止 */
            if (r < 1.02 || (r < 1.45 && pdIn < 0.0)){ transmittance = 0.0; swallowed = true; break; }
            if (isCapturedNew && r < DISK_R_IN){ transmittance = 0.0; swallowed = true; break; }
            /* [ART-几何] 出射早停：已远离且超过安全半径（无着色体可达）时结束积分 */
            if (pdIn > 0.0 && r2 > EXIT2){ swallowed = false; break; }

            float rc2 = pos.x*pos.x + pos.z*pos.z;  // [EXACT] 仅用 rc² 做门控
            float ayv = abs(pos.y);

            /* --- 自适应步长：远场按曲率尺度放大，盘片附近分层收紧 --- */
            float dt = clamp(0.16*r, 0.045, 2.6);
            float photonStep = 0.095 + 0.05*abs(r - 1.5);
            dt = min(dt, mix(photonStep, dt, smoothstep(2.6, 5.0, r)));
            if (rc2 < RC_DT1) dt = min(dt, ayv*0.45 + 0.30);  // [EXACT] 平方比较，语义等价
            if (rc2 < RC_DT2 && ayv < 2.2)
              dt = min(dt, ayv < FINE_Y_OUT ? DT_NEAR : DT_GLOW);
            if (rc2 < RC_DT2 && rc2 > DISK_R_IN*DISK_R_IN*0.81){
              float fineW = 1.0 - smoothstep(FINE_Y_IN, FINE_Y_OUT, ayv);
              dt = min(dt, mix(dt, 0.07, fineW));
            }

            /* --- 零测地线积分（速度 Verlet）：a = −3/2·h²·r̂/r⁴ --- */
            vec3  npos = pos + dir*dt + acc*(0.5*dt*dt);
            float nr2  = max(dot(npos, npos), 1e-8);
            float nr   = sqrt(nr2);
            vec3  nacc = npos * (K/(nr2*nr2*nr));
            vec3  ndir = dir + (acc + nacc)*(0.5*dt);
            // 旧版口径：每步归一化方向（与旧版盘一致）；默认不归一化，保留 |v| = √(1+h²/r³)
            if (useLegacy) ndir *= inversesqrt(max(dot(ndir, ndir), 1e-12));

            /* --- 有限厚度盘板：光线步段与 |y| ≤ DISK_H 求交后采样 --- */
            bool hitSlab = min(pos.y, npos.y) < DISK_H && max(pos.y, npos.y) > -DISK_H;
            if (hitSlab){
              if (!inSlab){
                inSlab   = true;
                slabF    = 0.0;
                slabTau  = 0.0;
                slabEmit = vec3(0.0);
                slabT0   = transmittance;
              }
              float dy = npos.y - pos.y;
              float safeDy = abs(dy) > 1e-6 ? dy : (dy >= 0.0 ? 1e-6 : -1e-6);
              float invDy = 1.0/safeDy;
              float t0 = (-DISK_H - pos.y)*invDy;
              float t1 = ( DISK_H - pos.y)*invDy;
              float tEnter = max(0.0, min(t0, t1));
              float tExit  = min(1.0, max(t0, t1));
              if (tExit > tEnter)
                diskSlabSample(pos, npos, normalize(mix(dir, ndir, 0.5)), tw, dy, invDy, tEnter, tExit,
                               slabF, slabTau, slabEmit);
            } else if (inSlab){
              /* 穿越结束：整段一次性结算，发射量 ∝ 整段柱密度 */
              inSlab = false;
              diskSlabSettle(slabF, slabTau, slabEmit, slabT0, accumColor, transmittance);
            }

            /* --- 盘面大气辉光：微弱的体积光，同样受引力透镜影响 --- */
            if (rc2 > 4.0 && rc2 < RC_GMAX){
              float rc = sqrt(rc2);
              float gH = 0.075*rc + 0.22;
              float y2 = pos.y*pos.y;
              if (y2 < 6.5*gH*gH){
                float env = exp(-y2/(2.0*gH*gH))
                          * smoothstep(DISK_R_IN - 0.9, DISK_R_IN + 1.2, rc)
                          * (1.0 - smoothstep(DISK_R_OUT*0.45, DISK_R_OUT*0.96, rc));
                if (env > 1.5e-3){
                  float n = textureLod(uDiskGlowNoise, (pos.xz*NOISE_FREQ + uDiskTime*GLOW_DRIFT)*NOISE_INV, 0.0).r;
                  float gd = env * GLOW_GAIN * (GLOW_BASE + GLOW_MOD*n);
                  float Tk = 2400.0 + 2800.0*exp(-rc*0.16);
                  float v   = min(sqrt(0.5/max(rc - 1.0, 0.32)), 0.8);
                  vec3  vd  = vec3(-pos.z, 0.0, pos.x)/rc;
                  float gam = inversesqrt(1.0 - v*v);
                  float g   = (1.0/(gam*(1.0 + v*dot(vd, normalize(dir))))) * sqrt(1.0 - 1.0/r);
                  accumColor   += transmittance * bbGlow(Tk) * gd * pow(g, 1.6*uDoppler*NEW_DOPPLER_GAIN) * 0.35 * dt * uGlow * NEW_GLOW_GAIN;
                  transmittance *= exp(-gd*0.5*dt);
                }
              }
            }

            pos = npos; dir = ndir;
            acc = nacc; r2 = nr2; r = nr;
            if (transmittance < 0.004){ swallowed = true; break; }
          }

          /* 积分结束时若仍在盘板内（步数耗尽/被吞没），补结算 */
          if (inSlab)
            diskSlabSettle(slabF, slabTau, slabEmit, slabT0, accumColor, transmittance);
        }

#else
        // =========================================================================
        // 1. 包围球裁剪与黑洞阴影内部 0 步解析剔除
        // =========================================================================
        const float rIn = DISK_R_IN;          // accretion disk inner edge (Rs)
        const float rOut = DISK_R_OUT;        // accretion disk outer edge (Rs)
        const float rIn2 = DISK_R_IN2;        // rIn ^ 2
        const float rOut2 = DISK_R_OUT2;      // rOut ^ 2
        const float invDiskSpan = 1.0 / (rOut - rIn);
        const float diskH = DISK_H;           // disk half-thickness (Rs)
        const float invDiskH = 1.0 / DISK_H;
        // 安全约束：跳过判定 b² ≥ rBound² 要求被跳光线的近点不低于盘外缘，
        // 即 rBound ≥ √(DISK_R_OUT³/(DISK_R_OUT−1))（史瓦西近点公式 b² = r³/(r−1)）。
        // r=10.2 时临界 b ≈ 10.740，+0.55 是该处的校准值，裕量仅 ~0.01；
        // 改 DISK_R_OUT 必须按公式重推（如 rOut=10.3 时需 ≥ 10.84，10.85 仅剩 0.01 裕量）
        const float rBound = 10.75;      // [COUPLED ↔ DISK_R_OUT] 外包围球半径 = DISK_R_OUT + 0.55
        const float rBound2 = rBound * rBound;
        bool skipLoop = false;

        if (r0 > rBound) {
          if (rDotD0 >= 0.0 || impactParameterSquared >= rBound2) {
            skipLoop = true;
            swallowed = false;
          } else {
            float tEntry = -rDotD0 - sqrt(max(0.0, rBound2 - impactParameterSquared));
            if (tEntry > 0.0) {
              vec3 entryPos = pos + dir * tEntry;
              float rE = length(entryPos);
              float uE = dot(entryPos, dir) / rE;
              float oneMinusUE = 1.0 - uE;
              // [EXACT] 入球前已积累偏折 = δ₁(c0) − δ₁(uE)，闭式同 baseWeakTerm 注
              float deltaThetaEntry = 0.5 * rs * b * (
                baseWeakTerm - (oneMinusUE * oneMinusUE * (2.0 + uE)) / b2Safe
              );
              dir = normalize(cos(deltaThetaEntry) * dir0 + sin(deltaThetaEntry) * ePerp);
              pos = entryPos;
            }
          }
        }

        bool isCapturedOrbit = (impactParameterSquared < captureB2) && (rDotD0 < 0.0);

        // 黑洞阴影内部在抵达 r < rIn 前若直线路径不可能触碰前景吸积盘薄板，直接 0 步跳过循环
        if (!skipLoop && isCapturedOrbit && abs(pos.y) > diskH && !canReachDiskSlab(pos, dir)) {
          skipLoop = true;
          swallowed = true;
        }

        float r2 = dot(pos, pos);
        float r = sqrt(r2);

        // =========================================================================
        // 2. 光线步进：按三维包络逐步积分密度，盘内采样取赤道交点并逐次重采
        // =========================================================================
        bool crossedDiskFront = false;
        bool useLegacy = uLegacyShadow > 0.5;

        if (!skipLoop) {
          // [EXACT] a = −1.5·rs·h²·r̂/r⁴，对应轨道方程 u″+u = 1.5·rs·u²（Schwarzschild 零测地线
          //         轨道形状，仅参数化不同）；系数 −1.5 禁改
          float neg15RsH2 = -1.5 * rs * impactParameterSquared;
          float invR = 1.0 / r;
          float invR2 = invR * invR;
          vec3 accel = (neg15RsH2 * (invR2 * invR2 * invR)) * pos;

          float filamentStructure = 0.0;

          for (int i = 0; i < 96; i++) {
            float rDotD = dot(pos, dir);
            float absY = abs(pos.y);

            float dirLen2 = dot(dir, dir);
            float invDirLen = useLegacy ? 1.0 : inversesqrt(max(dirLen2, 1e-12));
            float dirLen = useLegacy ? 1.0 : (dirLen2 * invDirLen);
            float absDirY = abs(dir.y);

            // [TOL] 视界 1.02（严格 1.0）、陷阱 1.45（判定阈值，非光子球半径 1.5）：把 captureB2
            // 漏网的近临界内向射线收进阴影，防步进绕光子球出噪点
            if (r < 1.02 || (r < 1.45 && rDotD < 0.0)) {
              swallowed = true;
              break;
            }

            if (isCapturedOrbit) {
              if (r < rIn || (crossedDiskFront && absY > diskH)) {
                swallowed = true;
                break;
              }
              if (absY > diskH && !canReachDiskSlab(pos, dir * invDirLen)) {
                swallowed = true;
                break;
              }
            }

            if (rDotD > 0.0) {
              if (r > rOut) {
                swallowed = false;
                break;
              }
              // [ART-几何] 提前逃逸判据的充分性裕度（0.55/1.50/0.25 手调、r>2.4 门限）：收紧可能在盘面
              // 附近漏步进（影缘/亮带闪烁），放宽只是多跑几步；判错会把未逃逸射线当星空，改后查影缘
              if (r > 2.4 && absY > diskH && pos.y * dir.y > 0.0) {
                if (absDirY * r2 * r > -0.55 * neg15RsH2 * dirLen ||
                    absDirY * r2 * r2 > -1.50 * neg15RsH2 * (absY * dirLen + 0.25 * r * absDirY)) {
                  swallowed = false;
                  break;
                }
              }
            }

            float dr = max(0.0, r - rs);
            float fineStep = 0.042 + 0.052 * dr;
            float vacuumStep = 0.046 + 0.068 * dr + 0.022 * dr * dr;
            bool inDiskCavity = (!isCapturedOrbit) && (((r < rIn) && (rDotD <= 0.0)) || (r + vacuumStep * dirLen < rIn));

            float stepSize = fineStep;
            if (inDiskCavity || absY > diskH) {
              if (!inDiskCavity && pos.y * dir.y < 0.0) {
                // 下限取 1e-6：不得放大，否则近水平射线步进被压小、96 步内到不了板面
                float distToSlab = (absY - diskH) / max(1e-6, absDirY * invDirLen);
                stepSize = min(vacuumStep, max(fineStep * 0.25, distToSlab * 0.92));
              } else {
                stepSize = vacuumStep;
              }
            }

            vec3 midDir = dir + accel * (0.5 * stepSize);
            vec3 nextPos = pos + midDir * stepSize;
            float nextR2 = dot(nextPos, nextPos);

            if (!inDiskCavity && min(pos.y, nextPos.y) < diskH && max(pos.y, nextPos.y) > -diskH) {
              crossedDiskFront = true;
              if (max(r2, nextR2) > rIn2) {
                float dy = nextPos.y - pos.y;
                float safeDy = abs(dy) > 1e-6 ? dy : (dy >= 0.0 ? 1e-6 : -1e-6);
                float invDy = 1.0 / safeDy;

                float t0 = (-diskH - pos.y) * invDy;
                float t1 = ( diskH - pos.y) * invDy;
                float tEnter = max(0.0, min(t0, t1));
                float tExit  = min(1.0, max(t0, t1));

                if (tExit > tEnter) {
                  vec3 midU = midDir * inversesqrt(max(dot(midDir, midDir), 1e-12));
                  float absMidDirY = abs(midU.y);

                  // 代表点取光线与赤道面交点（夹到本步弦内）：掠射时弦中点会落在错误半径上，导致环带粗细不均
                  float tSample = clamp(-pos.y * invDy, tEnter, tExit);
                  float tauSample = tSample * stepSize;
                  vec3 samplePos = pos + (dir + accel * (0.5 * tauSample)) * tauSample;
                  float sampleR2 = dot(samplePos, samplePos);

                  // 与纹理无关的径向/垂直衰减先算：据此可证明本次发射必然被丢弃，从而跳过纹理采样
                  float invSampleR = inversesqrt(max(sampleR2, 1e-12));
                  float sampleR = sampleR2 * invSampleR;
                  float radialNorm = (sampleR - rIn) * invDiskSpan;
                  float innerEdge = smoothstep(0.0, 0.12, radialNorm);
                  float outerEdge = pow(max(1.0 - radialNorm, 0.0), 2.45);
                  float radialFalloff = innerEdge * outerEdge;

                  float ua = clamp((pos.y + dy * tEnter) * invDiskH, -1.0, 1.0);
                  float ub = clamp((pos.y + dy * tExit) * invDiskH, -1.0, 1.0);
                  // [EXACT] 抛物剖面 (1-u²) 的弦段均值 = (ub³-ua³)/(3(ub-ua)) = (ua²+ua·ub+ub²)/3
                  float verticalFalloff = max(0.0, 1.0 - (ua * ua + ua * ub + ub * ub) * (1.0 / 3.0));

                  float baseEnv = radialFalloff * verticalFalloff;
                  float innerCorona = exp(-radialNorm * 8.5) * CORONA_MAX;  // 8.5 内缘衰减陡度 [ART]

                  // 提前退出依据：density ≤ baseEnv·DENS_MAX（上界见文件头），不过门限即可跳过纹理采样
                  bool emitPossible = (transmittance * baseEnv * DENS_MAX) > 0.0012;

                  // 纹理与密度取同一点（samplePos），逐次重采：门限与 rIn2 裁剪均为等价裁剪，旧值不会被误用
                  // [TOL] 纹理门（·1.06）刻意比发射门宽 6%：盘缘过渡带仍有纹理、发射由下方门裁出，禁"统一"
                  if (emitPossible && sampleR2 > rIn2 && sampleR2 < rOut2 * 1.06) {
                    vec3 texPos = samplePos;
                    float texR2 = clamp(sampleR2, rIn2 * 1.001, rOut2 * 0.999);
                    float invTexR = inversesqrt(texR2);
                    float texR = texR2 * invTexR;

                    vec3 dCam = texPos - uCamPos;
                    float drPixel2 = (dot(dCam, dCam) * invMinDim2) / max(0.0784, absMidDirY * absMidDirY);
                    float mipBias = clamp(0.5 * log2(max(drPixel2, 1e-6) * 14.44), -0.45, 1.35);

                    float angle = atan(texPos.z, texPos.x);
                    // [ART] 视觉自转角速度（超开普勒）；严格开普勒值 Ω = √(0.5)·r^-1.5 ≈ 0.7071·r^-1.5（M=rs/2）
                    // 下方 mod 回绕只要求 ω>0，改本式的系数/指数均安全
                    float omega = 2.35 * pow(invTexR, 1.35);
                    float spinPeriod = 6.2831853 / max(omega * uSpeed, 1e-4);
                    float spinTime = mod(uTime, spinPeriod);
                    // [COUPLED ↔ uvShear1/2/3 的 uAngle 系数（1/3/6 均须整数）、下方 sinVec 的角频率]
                    // uAngle 以圈为单位（0.15915494 = 1/2π），spinTime 每圈回绕使其跳恰 1 圈，由整数系数与
                    // ≈2π 整数倍 sin 频率（6.28318≈2π、12.56637≈4π）吸收；改非整数即出接缝
                    // 负号：图案漂移与物质绕行同向（vd=(−z,0,x) 即 +θ，见下方 cosTheta）；
                    // spinTime 回绕跳量仍是整圈（∓1），整数系数照常吸收
                    float uAngle = (angle - spinTime * omega * uSpeed) * 0.15915494;

                    float logR = log(texR * (1.0 / rIn));
                    // [COUPLED ↔ js/main.js] uTime 回绕 36000 对纹理的影响（改周期或速度须两处同步复核）：
                    // 线性项 uSpeed=1（或滑杆网格上 0.25 的整数倍）时 36000×0.015/0.024/0.032 为整数、无缝，
                    // 其余速度的 0.024/0.032 通道跳非整数格；盘旋转通道跳 -(36000 mod spinPeriod)/spinPeriod 圈、
                    // 随半径变化，任何速度都有一帧跳（既有行为，不撕裂、不累积）
                    vec2 uvShear1 = vec2(uAngle + logR * 0.58, logR * 1.55 - uTime * 0.015 * uSpeed);
                    vec2 uvShear2 = vec2(uAngle * 3.0 - logR * 1.10, texR * 0.68 + uTime * 0.024 * uSpeed);
                    vec2 uvShear3 = vec2(uAngle * 6.0 + logR * 1.85, texR * 1.45 - uTime * 0.032 * uSpeed);

                    // [COUPLED ↔ uvShear1/2/3 系数、gl-utils.js 512² 噪声纹理] 绝对 LOD：此处位于
                    // 光线循环的非均匀控制流内，texture 的隐式导数属 ESSL 3.00 未定义行为，改为按
                    // 解析足迹显式求取。量纲：drPixel2 =（世界单位/像素）²，即沿光线的盘面足迹²
                    //（含 1/max(0.28,|dirY|) 掠射拉伸，见上式）；J = |∂uvShear/∂r| 为噪声 UV/世界单位
                    // 的径向变化率（uAngle 沿径向不变、时间项帧内恒定，仅 logR/texR 项贡献；
                    // 各行常数 = uvShear 系数的径向合成：1 为 (0.58²+1.55²)·invTexR²，
                    // 2/3 另含 texR 直项 0.68/1.45；径向速率恒比方位向（≤6/(2πr)）大一个数量级，
                    // 取径向即可）。drPixel2·J² =（UV/像素）²，×512² 化为纹素足迹²，
                    // log2 即隐式导数本应给出的量，再加原 mipBias 保持原观感（tex3 另 +0.25）
                    float lodNoise1 = 0.5 * log2(max(drPixel2, 1e-6) * (2.7389 * invTexR * invTexR) * 262144.0) + mipBias;
                    float lodNoise2 = 0.5 * log2(max(drPixel2, 1e-6) * (1.21 * invTexR * invTexR + 0.4624) * 262144.0) + mipBias;
                    float lodNoise3 = 0.5 * log2(max(drPixel2, 1e-6) * (3.4225 * invTexR * invTexR + 2.1025) * 262144.0) + mipBias + 0.25;

                    vec3 tex1 = textureLod(uNoiseTex, uvShear1, lodNoise1).rgb;
                    vec3 tex2 = textureLod(uNoiseTex, uvShear2 + tex1.rg * 0.06, lodNoise2).rgb;
                    float tex3 = (transmittance > 0.24)
                      ? textureLod(uNoiseTex, uvShear3 - tex2.gb * 0.04, lodNoise3).b
                      : (0.5 * (tex1.g + tex2.r));

                    vec3 w123 = exp(vec3(-40.5, -352.8, -1862.08) * drPixel2);
                    vec3 sinVec = sin(vec3(
                      texR * 15.0 + tex1.r * 5.0,
                      texR * 42.0 + tex2.g * 5.6 + uAngle * 6.28318,
                      texR * 92.0 + tex3 * 6.2 - uAngle * 12.56637
                    ));

                    float sharpFilaments = 0.5 + dot(w123 * sinVec, vec3(0.22, 0.17, 0.11));
                    float magneticThreads = tex1.b * 0.45 + tex2.b * 0.35 + tex3 * 0.20;
                    float fRaw = clamp(mix(magneticThreads, sharpFilaments, 0.68), 0.0, 1.0);
                    filamentStructure = pow(fRaw, 1.18);
                  }

                  if (sampleR2 > rIn2 && sampleR2 < rOut2) {
                    float density = baseEnv * (DENS_BASE + DENS_FIL * filamentStructure + innerCorona);

                    // 门限与上方 emitPossible（transmittance·baseEnv·DENS_MAX > 0.0012）同源，两点须一致
                    if (transmittance * density > 0.0012) {
                      float invSampleR2 = invSampleR * invSampleR;
                      // [EXACT] 柱面半径倒数 1/√(r²−y²) 的一阶展开 (1/r)(1+0.5y²/r²)，掠射防削波够用
                      float inverseSlantRadius = invSampleR * (1.0 + 0.5 * samplePos.y * samplePos.y * invSampleR2);
                      float cosTheta = (samplePos.z * midU.x - samplePos.x * midU.z) * inverseSlantRadius;
                      // [ART] 轨道速度取牛顿级 √(0.5rs/r)（严格 GR 局域速度还差 /√(1-rs/r)，ISCO 处 0.5c，未采用）
                      float orbitalBeta = clamp(sqrt(0.5 * invSampleR), 0.0, 0.66);
                      // [ART] 多普勒用一阶线性化 1+βcosθ，增益 1.42、下限 0.22、集束指数 2.55 为视觉调参；
                      // 严格式为 δ = 1/(γ(1-βcosθ))、强度 ∝ δ³（未严格化）
                      float dopplerFactor = max(0.22, 1.0 + uDoppler * orbitalBeta * cosTheta * 1.42);
                      // [EXACT] 静态发射体引力红移 √(1-rs/r)；0.10 下限 [TOL] 防 r→rs 奇异
                      // （绕行物质的严格联合频移 g = √(1-1.5rs/r)/(1-Ωb·cosφ) 未严格化，由视觉增益代偿）
                      float gravRedshift = sqrt(max(0.10, 1.0 - invSampleR));

                      // [ART] 风格化温度剖面，近似 Shakura–Sunyaev 薄盘 T ∝ r^(-3/4)
                      float localTemp = (1.04 - 0.62 * pow(radialNorm, 0.72) + 0.26 * filamentStructure) * dopplerFactor * gravRedshift * uTemp;
                      vec3 emitCol = planckBlackbody(localTemp);

                      float slabPath = min((tExit - tEnter) * stepSize * dirLen, diskH * 3.6);
                      float intensity = density * pow(dopplerFactor, 2.55) * gravRedshift * uGlow * 5.8;
                      float alpha = clamp(density * slabPath * 6.8, 0.0, 1.0);

                      accumColor += transmittance * emitCol * (intensity * slabPath);
                      transmittance *= (1.0 - alpha * 0.78);

                      if (transmittance < 0.010) {
                        swallowed = true;
                        break;
                      }
                    }
                  }
                }
              }

              if (isCapturedOrbit && crossedDiskFront && abs(nextPos.y) > diskH && (nextPos.y - pos.y) * nextPos.y > 0.0) {
                swallowed = true;
                break;
              }
            }

            float nextInvR = inversesqrt(nextR2);
            float nextR = nextR2 * nextInvR;
            float nextInvR2 = nextInvR * nextInvR;
            vec3 nextAccel = (neg15RsH2 * (nextInvR2 * nextInvR2 * nextInvR)) * nextPos;
            dir = dir + 0.5 * (accel + nextAccel) * stepSize;
            if (useLegacy) dir *= inversesqrt(max(dot(dir, dir), 1e-12));

            pos = nextPos;
            r2 = nextR2;
            r = nextR;
            accel = nextAccel;
          }
        }
#endif

        // =========================================================================
        // 3. 延迟计算引力透镜偏折角、光子环与深空星域合成
        // =========================================================================
        // （bCrit / bShadow 已上移至文件头常数族，勿本地另写）

        // 光子环由撞击参数 b 驱动、峰值锚定 bCrit；不用球面最近点：临界带射线已判吞没（第 1/2 节）无近点
        bool ringOn = uPhotonRing > 0.5;
        // [ART] 环辉轮廓：110 锐尾、10 柔晕、0.14/0.95/0.9 幅度；[bCrit,bShadow] 临界带只补环辉、压被压缩星像
        float bandRing = exp(-max(0.0, b - bCrit) * 110.0);

        if (!swallowed) {
          float bSafe = max(b, 0.6 * rs);

    </div>
    <div class="hud-telemetry__row"><span class="hud-telemetry__label" data-i18n="telemetryRes">渲染缓冲</span><span class="hud-telemetry__value" id="hud-telemetry-res">1920×1080 (1.20x)</span></div>
    <div class="hud-telemetry__row"><span class="hud-telemetry__label" data-i18n="telemetryDist">视界距离</span><span class="hud-telemetry__value" id="hud-telemetry-dist">1.00x (13.2 Rs)</span></div>
    <div class="hud-telemetry__row"><span class="hud-telemetry__label" data-i18n="telemetryRsh">光子环Rc</span><span class="hud-telemetry__value" id="hud-telemetry-rsh">2.60 Rs</span></div>
    <div class="hud-telemetry__row"><span class="hud-telemetry__label" data-i18n="telemetryInc">轨道姿态</span><span class="hud-telemetry__value" id="hud-telemetry-inc">+8.1° / 24°</span></div>
    <div class="hud-telemetry__row"><span class="hud-telemetry__label" data-i18n="telemetrySeed">星域序列</span><span class="hud-telemetry__value" id="hud-telemetry-seed">#A7F2</span></div>
  </div>

  <div class="hud-fps-mini hud-panel hud-panel--transition" id="hud-fps-mini">60</div>

  <!-- 控制面板：预设、滑杆与模式开关 -->
  <div class="hud-controls hud-panel hud-panel--transition">
    <h2 class="hud-controls__title">
      <span class="hud-controls__title-text" data-i18n="controlsTitle">时空光学控制</span>
      <button class="hud-controls__lang-btn" id="hud-btn-lang" title="点击切换语言 (快捷键: L)">EN</button>
    </h2>

    <div class="hud-controls__preset-row">
      <button class="hud-controls__preset-btn is-active" data-pitch="0.142" data-scale="1.00" data-roll="-10" data-i18n="preset1">经典卡冈都亚</button>
      <button class="hud-controls__preset-btn" data-pitch="0.038" data-scale="1.15" data-roll="-4" data-i18n="preset2">掠射赤道 88°</button>
      <button class="hud-controls__preset-btn" data-pitch="1.5708" data-scale="0.85" data-roll="0" data-i18n="preset3">极轴俯瞰 90°</button>
    </div>

    <div class="hud-controls__group">
      <div class="hud-controls__label">
        <span class="hud-controls__label-text" data-i18n="labelZoom">视界尺度</span>
        <span class="hud-controls__value" id="hud-val-zoom">1.00x</span>
      </div>
      <input class="hud-controls__slider" type="range" id="hud-slider-zoom" min="0.10" max="2.50" step="0.01" value="1.00" />
    </div>

    <div class="hud-controls__group">
      <div class="hud-controls__label">
        <span class="hud-controls__label-text" data-i18n="labelGlow">吸积盘光度</span>
        <span class="hud-controls__value" id="hud-val-glow">1.22</span>
      </div>
      <input class="hud-controls__slider" type="range" id="hud-slider-glow" min="0.40" max="2.40" step="0.01" value="1.22" />
    </div>

    <div class="hud-controls__group">
      <div class="hud-controls__label">
        <span class="hud-controls__label-text" data-i18n="labelDoppler">多普勒集束</span>
        <span class="hud-controls__value" id="hud-val-doppler">1.00</span>
      </div>
      <input class="hud-controls__slider" type="range" id="hud-slider-doppler" min="0.00" max="1.60" step="0.01" value="1.00" />
    </div>

    <div class="hud-controls__group">
      <div class="hud-controls__label">
        <span class="hud-controls__label-text" data-i18n="labelTemp">黑体色温</span>
        <span class="hud-controls__value" id="hud-val-temp">1.00</span>
      </div>
      <input class="hud-controls__slider" type="range" id="hud-slider-temp" min="0.60" max="1.60" step="0.01" value="1.00" />
    </div>

    <div class="hud-controls__group">
      <div class="hud-controls__label">
        <span class="hud-controls__label-text" data-i18n="labelCosmos">星尘丰度</span>
        <span class="hud-controls__value" id="hud-val-cosmos">1.00</span>
      </div>
      <input class="hud-controls__slider" type="range" id="hud-slider-cosmos" min="0.00" max="2.00" step="0.01" value="1.00" />
    </div>

    <div class="hud-controls__group">
      <div class="hud-controls__label">
        <span class="hud-controls__label-text" data-i18n="labelTwinkle">星光闪烁</span>
        <span class="hud-controls__value" id="hud-val-twinkle">1.00</span>
      </div>
      <input class="hud-controls__slider" type="range" id="hud-slider-twinkle" min="0.00" max="3.00" step="0.01" value="1.00" />
    </div>

    <div class="hud-controls__group">
      <div class="hud-controls__label">
        <span class="hud-controls__label-text" data-i18n="labelBloom">镜头眩光</span>
        <span class="hud-controls__value" id="hud-val-bloom">0.80</span>
      </div>
      <input class="hud-controls__slider" type="range" id="hud-slider-bloom" min="0.00" max="2.00" step="0.01" value="0.80" />
    </div>

    <div class="hud-controls__group">
      <div class="hud-controls__label">
        <span class="hud-controls__label-text" data-i18n="labelScreenBloom">泛光</span>
        <span class="hud-controls__value" id="hud-val-screenbloom">0.70</span>
      </div>
      <input class="hud-controls__slider" type="range" id="hud-slider-screenbloom" min="0.00" max="2.00" step="0.01" value="0.70" />
    </div>

    <div class="hud-controls__group">
      <div class="hud-controls__label">
        <span class="hud-controls__label-text" data-i18n="labelSpeed">轨道角速</span>
        <span class="hud-controls__value" id="hud-val-speed">1.00</span>
      </div>
      <input class="hud-controls__slider" type="range" id="hud-slider-speed" min="0.00" max="2.20" step="0.01" value="1.00" />
    </div>

    <div class="hud-controls__group">
      <div class="hud-controls__label">
        <span class="hud-controls__label-text" data-i18n="labelRoll">镜头倾角</span>
        <span class="hud-controls__value" id="hud-val-roll">-10°</span>
      </div>
      <input class="hud-controls__slider" type="range" id="hud-slider-roll" min="-180" max="180" step="1" value="-10" />
    </div>

    <div class="hud-controls__group">
      <div class="hud-controls__label">
        <span class="hud-controls__label-text" data-i18n="labelScale">超采样率</span>
        <span class="hud-controls__value" id="hud-val-scale">1.20x</span>
      </div>
      <input class="hud-controls__slider" type="range" id="hud-slider-scale" min="0.30" max="1.80" step="0.01" value="1.20" />
    </div>

    <div class="hud-controls__action-row">
      <button id="hud-btn-drs" class="hud-controls__action-btn is-active" data-i18n="drs" title="自动保持满帧运行，最高超采样至 1.30x">自适应满帧</button>
      <button id="hud-btn-cruise" class="hud-controls__action-btn is-active" data-i18n="cruise">轨道巡航</button>
    </div>
    <div class="hud-controls__action-row">
      <button id="hud-btn-new-disk" class="hud-controls__action-btn" data-i18n="newDisk">新版吸积盘</button>
      <button id="hud-btn-photon-ring" class="hud-controls__action-btn" data-i18n="photonRing">光子环</button>
      <button id="hud-btn-legacy-shadow" class="hud-controls__action-btn" data-i18n="legacyShadow">旧版黑洞</button>
    </div>
    <div class="hud-controls__action-row">
      <button id="hud-btn-random-cosmos" class="hud-controls__action-btn" data-i18n="randomCosmos">随机星域</button>
      <button id="hud-btn-reset" class="hud-controls__action-btn" data-i18n="resetAll">全部重置</button>
    </div>
  </div>

  <!-- 底部操作栏 -->
  <div class="hud-bottom-bar">
    <button class="hud-bottom-bar__btn hud-bottom-bar__btn--landscape" id="hud-btn-landscape" title="切换横屏 / 竖屏">横屏</button>
    <button class="hud-bottom-bar__btn" id="hud-btn-toggle" title="快捷键: H"><span class="hud-bottom-bar__text-full">隐藏界面 (H)</span><span class="hud-bottom-bar__text-short">隐藏</span></button>
  </div>

  <!-- 渲染画布与入口模块 -->
  <canvas id="gl-canvas"></canvas>

</body>
</html>
